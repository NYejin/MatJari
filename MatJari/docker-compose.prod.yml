# 운영(로컬 PC 온프레미스 등) 구성. 개발용 docker-compose.yml 과 달리:
#  - 밖으로 열리는 포트는 web(nginx) 하나뿐이다. DB(3306)·백엔드(8080)는 컨테이너 내부 네트워크에서만 쓴다.
#  - 프런트는 빌드된 정적 파일을 nginx 가 서빙하고 /api, /ws 를 백엔드로 넘긴다(같은 출처).
#  - SQL 로그를 끄고, 필수 비밀값이 비어 있으면 기동하지 않는다.
# 실행: cp .env.example .env 로 값을 채운 뒤  docker compose -f docker-compose.prod.yml up -d
# (이미지는 ghcr.io 에서 받는다. 소스에서 직접 빌드하려면 -f docker-compose.build.yml 을 덧붙이고 up -d --build)
# 공개 인터넷에 열 때(Cloudflare Tunnel):  ... --profile tunnel up -d --build  (.env 의 TUNNEL_TOKEN 필요)
name: matjari-prod
services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: matjari
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      MYSQL_USER: matjari
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # GitHub CI 가 master 병합 때 만들어 ghcr.io 에 올린 이미지(소스 빌드는 docker-compose.build.yml 을 덧붙여 쓴다)
    image: ${IMAGE_PREFIX:-ghcr.io/nyejin}/matjari-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/matjari
      SPRING_DATASOURCE_USERNAME: matjari
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      TZ: Asia/Seoul
      MATJARI_UPLOAD_DIR: /data/seat-claims
      # 접속 주소(PUBLIC_URL) 하나로 CORS/WS 허용 Origin 과 소셜 로그인 주소를 모두 맞춘다
      MATJARI_WS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL 을 .env 에 설정하세요}
      MATJARI_SOCIAL_BACKEND_BASE_URL: ${PUBLIC_URL}
      MATJARI_SOCIAL_FRONTEND_BASE_URL: ${PUBLIC_URL}
      MATJARI_SOCIAL_COOKIE_SECURE: ${SOCIAL_COOKIE_SECURE:-false}
      MATJARI_SOCIAL_STATE_SECRET: ${SOCIAL_STATE_SECRET:-dev-only-insecure-social-state-secret-please-override-0123456789}
      MATJARI_SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      MATJARI_SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
      MATJARI_SOCIAL_KAKAO_CLIENT_ID: ${SOCIAL_KAKAO_CLIENT_ID:-}
      MATJARI_SOCIAL_KAKAO_CLIENT_SECRET: ${SOCIAL_KAKAO_CLIENT_SECRET:-}
      MATJARI_SOCIAL_NAVER_CLIENT_ID: ${SOCIAL_NAVER_CLIENT_ID:-}
      MATJARI_SOCIAL_NAVER_CLIENT_SECRET: ${SOCIAL_NAVER_CLIENT_SECRET:-}
      # AI(공연 상세 이미지 읽기, 구현 예정): 값이 비어 있으면 AI 기능은 꺼진다. 키는 .env 에만 둔다(.env.example 참고)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 가입 이메일 인증번호. 접속 주소가 localhost 가 아니면 log 모드는 기동이 거부된다 → smtp 로 설정
      MATJARI_MAIL_MODE: ${MAIL_MODE:-log}
      MATJARI_MAIL_FROM: ${MAIL_FROM:-}
      MATJARI_EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:-dev-only-insecure-email-code-secret-please-override}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    volumes:
      - upload_data:/data/seat-claims

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/nyejin}/matjari-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 같은 공유기 안의 기기만 쓰려면 그대로, 이 PC에서만 쓰려면 127.0.0.1:80:80 으로 바꾼다
      - "${WEB_PORT:-80}:80"

  # 공개 인터넷에 열 때만(--profile tunnel). 공유기 포트포워딩 없이 Cloudflare 가 https 로 이 PC의 web 으로 연결해 준다.
  # Cloudflare Zero Trust 에서 터널을 만들고 Public Hostname 의 서비스를 http://web:80 으로 지정한다.
  cloudflared:
    image: cloudflare/cloudflared:2024.9.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  mysql_data:
  upload_data:
