# CI: PR과 master 푸시마다 백엔드 테스트(실제 MySQL 통합 테스트 포함)와 프런트 빌드를 GitHub 서버에서 돌린다.
# 배포: master 푸시에서 테스트가 모두 통과하면 도커 이미지(backend·web)를 ghcr.io 에 올린다. 내 PC 는 이 이미지를 가져가
# 교체할 뿐 GitHub 의 코드를 실행하지 않는다(MatJari/deploy/update.ps1, self-hosted runner 없음).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 은 새 푸시가 오면 이전 실행을 취소하지만 master 는 이미지 푸시가 중간에 끊기지 않게 취소하지 않는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 앱은 KST 기준으로 시각을 다룬다(개발 PC와 같은 조건으로 돌린다)
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 통합 테스트용 임시 MySQL. 통합 테스트는 컨텍스트를 여러 개 만들어 기본 최대 연결 수(151)를 넘기므로 올려서 띄운다.
      # DB 이름은 테스트 보호 장치 규칙대로 `_it` 로 끝나야 하고 호스트는 127.0.0.1 이어야 한다.
      - name: 임시 MySQL 시작
        run: |
          docker run -d --name matjari-ci-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=ci-root-pw -e MYSQL_DATABASE=matjari_ci_it \
            mysql:8.0 --character-set-server=utf8mb4 --max-connections=500
          for i in $(seq 1 60); do
            docker exec matjari-ci-mysql mysqladmin ping -uroot -pci-root-pw --silent 2>/dev/null && break
            sleep 2
          done
          # 초기화용 임시 서버가 내려가고 본 서버가 다시 뜰 때까지 한 번 더 기다린다
          sleep 10
          docker exec matjari-ci-mysql mysql -uroot -pci-root-pw -e "SELECT 1" matjari_ci_it

      - name: 백엔드 전체 테스트
        working-directory: MatJari/backend
        env:
          MATJARI_IT_JDBC_URL: jdbc:mysql://127.0.0.1:3306/matjari_ci_it
          MATJARI_IT_USER: root
          MATJARI_IT_PASSWORD: ci-root-pw
          MATJARI_IT_REQUIRED: 'true'
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 테스트 리포트 올리기(실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: MatJari/backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프런트 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MatJari/frontend/package-lock.json

      - name: 의존성 설치와 빌드(tsc + vite)
        working-directory: MatJari/frontend
        run: |
          npm ci
          npm run build

  # master 푸시에서만, 테스트와 빌드가 통과한 뒤에만 실행. PR·포크에서는 실행되지 않으므로 이미지를 올릴 수 없다.
  publish:
    name: 이미지 빌드·푸시
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # 개인정보처리방침 화면에 굳는 값(저장소 Settings > Secrets and variables > Actions > Variables). 비어 있으면 '설정 필요'로 보인다
      VITE_PRIVACY_OPERATOR: ${{ vars.VITE_PRIVACY_OPERATOR }}
      VITE_PRIVACY_CONTACT_EMAIL: ${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
      VITE_PRIVACY_EFFECTIVE_DATE: ${{ vars.VITE_PRIVACY_EFFECTIVE_DATE }}
    steps:
      - uses: actions/checkout@v4

      - name: ghcr.io 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 이미지 빌드와 푸시 (latest + sha 태그)
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          PREFIX="ghcr.io/$OWNER"
          TAG="sha-${GITHUB_SHA::7}"
          SOURCE="https://github.com/$GITHUB_REPOSITORY"

          docker build -t "$PREFIX/matjari-backend:latest" -t "$PREFIX/matjari-backend:$TAG" \
            --label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            MatJari/backend

          docker build -f MatJari/frontend/Dockerfile.prod \
            -t "$PREFIX/matjari-web:latest" -t "$PREFIX/matjari-web:$TAG" \
            --label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg "VITE_PRIVACY_OPERATOR=$VITE_PRIVACY_OPERATOR" \
            --build-arg "VITE_PRIVACY_CONTACT_EMAIL=$VITE_PRIVACY_CONTACT_EMAIL" \
            --build-arg "VITE_PRIVACY_EFFECTIVE_DATE=$VITE_PRIVACY_EFFECTIVE_DATE" \
            MatJari/frontend

          for image in matjari-backend matjari-web; do
            docker push "$PREFIX/$image:latest"
            docker push "$PREFIX/$image:$TAG"
          done
          echo "올린 이미지: $PREFIX/matjari-backend, $PREFIX/matjari-web (태그 latest, $TAG)"
