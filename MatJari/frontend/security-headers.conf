# 공통 보안 헤더. nginx 는 location 안에 add_header 가 하나라도 있으면 server 단계 add_header 를 상속하지 않으므로,
# server 와 add_header 를 쓰는 모든 location 에서 이 파일을 include 한다.
# CSP 허용 호스트(img-src)는 포스터 허용 호스트(백엔드·PosterImage)와 같아야 한다. 호스트를 추가하면 여기도 고친다(README 참고).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tkfile.yes24.com https://image.toast.com https://cdnticket.melon.co.kr https://ticketimage.interpark.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# HSTS 는 https(Cloudflare 터널)로 들어온 요청에만 붙는다(값이 빈 문자열이면 헤더를 보내지 않는다).
add_header Strict-Transport-Security $hsts_header always;
