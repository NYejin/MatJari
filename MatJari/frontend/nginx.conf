# 한 주소(도메인) 아래에서 정적 파일, /api, /ws 를 모두 처리한다 → 브라우저 입장에서 같은 출처라 CORS 문제가 없다.
# 이 파일은 conf.d 아래에 들어가 http 단계에 include 되므로 map·limit_req_zone 을 server 밖(맨 위)에 둘 수 있다.

# HSTS 는 Cloudflare 터널이 붙인 X-Forwarded-Proto 가 https 일 때만(http 로 직접 들어온 개발·내부 요청에는 보내지 않는다).
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=15552000";
}

# 인증 엔드포인트(로그인·가입·재발급·소셜) 속도 제한: 접속자 IP당 분당 10회(+burst 20). 초과는 429.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 클라이언트 IP: cloudflared 컨테이너(도커 사설망)에서 온 요청만 CF-Connecting-IP 를 믿는다(realip 모듈은 공식 nginx 이미지에 기본 포함).
    # 한계: 도커 망 안의 다른 컨테이너가 직접 보낸 요청의 CF-Connecting-IP 도 믿는다(망 밖에서 web 포트를 직접 열지 않는다는 전제).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # 좌석 인증 사진 업로드(백엔드 한도 5 MiB + 여유)
    client_max_body_size 6m;

    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # 로그인·가입 등: 일반 /api/ 와 같은 프록시 설정 + 속도 제한 (nginx 는 가장 긴 접두사 location 을 고른다)
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 채팅·알림 STOMP over WebSocket
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 해시가 붙은 정적 자원은 오래 캐시
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로는 index.html (index.html 자체는 캐시하지 않는다)
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
